name: Build and Deploy MEAN Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################
      # Build Backend Image
      ####################################
      - name: Build Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:v1 ./backend

      - name: Push Backend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:v1

      ####################################
      # Build Frontend Image
      ####################################
      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:v1 ./frontend

      - name: Push Frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:v1

      ####################################
      # Install kubectl
      ####################################
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      ####################################
      # Configure kubeconfig
      ####################################
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      ####################################
      # Deploy Kubernetes Resources
      ####################################
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

      ####################################
      # Restart Deployments
      ####################################
      - name: Restart Deployments
        run: |
          kubectl rollout restart deployment/backend -n mean-app
          kubectl rollout restart deployment/frontend -n mean-app

      ####################################
      # Verify Deployment
      ####################################
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/backend -n mean-app
          kubectl rollout status deployment/frontend -n mean-app
          kubectl get pods -n mean-app