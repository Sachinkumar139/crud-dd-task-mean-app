name: CI-CD-EKS

on:
  push:
    branches:
      - main

jobs:

  # =====================================
  # 1. CODE QUALITY + DOCKER BUILD
  # =====================================
  build-test-sonarqube:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -------------------------------
      # Frontend
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Test Frontend
        working-directory: frontend
        run: npm test -- --watch=false
        continue-on-error: true

      # -------------------------------
      # Backend
      # -------------------------------
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Test Backend
        working-directory: backend
        run: npm test
        continue-on-error: true

      # -------------------------------
      # SonarQube
      # -------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -------------------------------
      # Docker Hub Login
      # -------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------
      # Build Frontend Image
      # -------------------------------
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t sachin139/mean-frontend:v1 \
            ./frontend

      # -------------------------------
      # Build Backend Image
      # -------------------------------
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t sachin139/mean-backend:v1 \
            ./backend

      # -------------------------------
      # Push Images to Docker Hub
      # -------------------------------
      - name: Push Frontend Image
        run: |
          docker push sachin139/mean-frontend:v1

      - name: Push Backend Image
        run: |
          docker push sachin139/mean-backend:$v1


  # =====================================
  # 2. TERRAFORM
  # =====================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: build-test-sonarqube

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # IMPORTANT
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # =====================================
  # 3. DEPLOY TO EKS
  # =====================================
  deploy:
    name: Deploy Application to EKS
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name mean-app-cluster

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
            frontend=sachin139/mean-frontend:${{ github.sha }} \
            -n mean-app

      - name: Update Backend Image
        run: |
          kubectl set image deployment/backend \
            backend=sachin139/mean-backend:${{ github.sha }} \
            -n mean-app

      - name: Wait for Frontend
        run: |
          kubectl rollout status deployment/frontend \
            -n mean-app

      - name: Wait for Backend
        run: |
          kubectl rollout status deployment/backend \
            -n mean-app

      - name: Verify Pods
        run: |
          kubectl get pods -n mean-app